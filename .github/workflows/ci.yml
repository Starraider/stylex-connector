name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3: '12.4', php: '8.1' }
          - { typo3: '12.4', php: '8.4' }
          - { typo3: '13.4', php: '8.2' }
          - { typo3: '13.4', php: '8.4' }
          - { typo3: '14.3', php: '8.2' }
          - { typo3: '14.3', php: '8.4' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, simplexml, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies for TYPO3 ${{ matrix.typo3 }}
        run: composer update --no-interaction --prefer-dist --no-progress --with "typo3/cms-core:^${{ matrix.typo3 }}" --with "typo3/cms-fluid:^${{ matrix.typo3 }}"

      - name: Lint PHP files
        run: |
          find Classes Configuration Tests Build -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php -l ext_localconf.php
          php -l ext_emconf.php

      - name: Check XLIFF files
        run: |
          find Resources/Private/Language -name '*.xlf' -print0 | xargs -0 -r -n1 php -r '$xml = new DOMDocument(); exit($xml->load($argv[1]) ? 0 : 1);'

      - name: Check coding style
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Check TYPO3 coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Analyze PHP
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=1G --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit.xml.dist
