categories:
  StylexConnector:
    label: 'StyleX Connector'
  StylexConnector.css:
    label: 'CSS & Assets'
    parent: StylexConnector

settings:
  StylexConnector.cssFilePath:
    label: 'StyleX CSS file path'
    description: 'Path to compiled StyleX CSS if loaded via TypoScript (leave empty if using Vite asset viewhelper in Fluid).'
    category: StylexConnector.css
    type: string
    default: ''

  StylexConnector.includeCssViaTypoScript:
    label: 'Include CSS via TypoScript'
    description: 'Enable to include StyleX CSS via TypoScript instead of <vite:asset> in templates.'
    category: StylexConnector.css
    type: bool
    default: false

  StylexConnector.declareCssLayers:
    label: 'Deprecated CSS layer switch'
    description: 'Deprecated, no output. Declare layer order first in your CSS build.'
    category: StylexConnector.css
    type: bool
    default: false

  StylexConnector.cssPriority:
    label: 'Deprecated StyleX CSS priority'
    description: 'Deprecated, ignored. TYPO3 has no numeric includeCSS priority.'
    category: StylexConnector.css
    type: int
    default: 60

  StylexConnector.bootstrapCssPriority:
    label: 'Deprecated Bootstrap CSS priority'
    description: 'Deprecated, ignored. TYPO3 has no numeric includeCSS priority.'
    category: StylexConnector.css
    type: int
    default: 40

  StylexConnector.overrideBootstrapPriority:
    label: 'Load known Bootstrap CSS first'
    description: 'Legacy switch: sets forceOnTop for known Bootstrap asset names.'
    category: StylexConnector.css
    type: bool
    default: false
